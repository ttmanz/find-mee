<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find-Mee — Your Night Starts Here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #090D18;
    --surface:  #0F1525;
    --surface2: #151C30;
    --gold:     #C8800A;
    --gold-lit: #E8A020;
    --gold-dim: rgba(200,128,10,0.15);
    --text:     #E8DCC8;
    --muted:    #7A7060;
    --border:   rgba(200,128,10,0.2);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

  /* nav */
  nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px;
    background: rgba(9,13,24,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo { font-size: 22px; font-weight: 900; color: var(--gold); letter-spacing: -0.5px; }
  .lang-switch { display: flex; gap: 6px; }
  .lang-btn {
    padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .2s;
  }
  .lang-btn.active { background: var(--gold); border-color: var(--gold); color: #090D18; }

  /* hero */
  .hero {
    min-height: 90vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 80px 24px 60px;
    background: radial-gradient(ellipse at 50% 0%, rgba(200,128,10,0.12) 0%, transparent 65%);
  }
  .hero-badge {
    display: inline-block; padding: 6px 16px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--gold); font-size: 13px;
    font-weight: 600; margin-bottom: 28px; background: var(--gold-dim);
  }
  .hero h1 {
    font-size: clamp(38px, 7vw, 76px); font-weight: 900; line-height: 1.1;
    letter-spacing: -2px; margin-bottom: 20px;
  }
  .hero h1 span { color: var(--gold); }
  .hero p {
    font-size: clamp(16px, 2.5vw, 20px); color: var(--muted); max-width: 600px;
    margin: 0 auto 40px; line-height: 1.7;
  }
  /* sections */
  section { padding: 96px 24px; max-width: 1100px; margin: 0 auto; }
  .section-label { font-size: 13px; font-weight: 700; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }
  .section-title { font-size: clamp(28px, 4vw, 44px); font-weight: 800; line-height: 1.2; margin-bottom: 16px; }
  .section-sub { color: var(--muted); font-size: 17px; max-width: 560px; line-height: 1.7; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 0 24px; }

  /* features */
  .features-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px; margin-top: 56px;
  }
  .feature-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 28px; transition: border-color .2s, transform .2s;
  }
  .feature-card:hover { border-color: var(--gold); transform: translateY(-4px); }
  .feature-icon { font-size: 36px; margin-bottom: 16px; }
  .feature-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .feature-desc { color: var(--muted); font-size: 14px; line-height: 1.6; }

  /* how it works */
  .steps { display: flex; flex-direction: column; margin-top: 56px; }
  .step { display: flex; gap: 28px; align-items: flex-start; padding: 32px 0; border-bottom: 1px solid var(--border); }
  .step:last-child { border-bottom: none; }
  .step-num {
    min-width: 52px; height: 52px; border-radius: 50%;
    background: var(--gold-dim); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; color: var(--gold); flex-shrink: 0;
  }
  .step-content h3 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .step-content p { color: var(--muted); font-size: 15px; line-height: 1.6; }

  /* footer */
  footer { border-top: 1px solid var(--border); padding: 40px 32px; text-align: center; color: var(--muted); font-size: 14px; }
  footer span { color: var(--gold); font-weight: 700; }

  @media (max-width: 600px) {
    nav { padding: 14px 20px; }
    section { padding: 64px 20px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">Find-Mee</div>
  <div class="lang-switch">
    <button class="lang-btn active" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('el')">EL</button>
    <button class="lang-btn" onclick="setLang('ru')">RU</button>
  </div>
</nav>

<div class="hero">
  <div class="hero-badge" data-i18n="badge"></div>
  <h1 data-i18n-html="hero_title"></h1>
  <p data-i18n="hero_sub"></p>
</div>

<hr class="divider">

<section>
  <div class="section-label" data-i18n="features_label"></div>
  <h2 class="section-title" data-i18n="features_title"></h2>
  <p class="section-sub" data-i18n="features_sub"></p>
  <div class="features-grid">
    <div class="feature-card"><div class="feature-icon">🗺️</div><div class="feature-title" data-i18n="feat1_title"></div><div class="feature-desc" data-i18n="feat1_desc"></div></div>
    <div class="feature-card"><div class="feature-icon">🏆</div><div class="feature-title" data-i18n="feat2_title"></div><div class="feature-desc" data-i18n="feat2_desc"></div></div>
    <div class="feature-card"><div class="feature-icon">⚡</div><div class="feature-title" data-i18n="feat3_title"></div><div class="feature-desc" data-i18n="feat3_desc"></div></div>
    <div class="feature-card"><div class="feature-icon">🌙</div><div class="feature-title" data-i18n="feat4_title"></div><div class="feature-desc" data-i18n="feat4_desc"></div></div>
    <div class="feature-card"><div class="feature-icon">🎭</div><div class="feature-title" data-i18n="feat5_title"></div><div class="feature-desc" data-i18n="feat5_desc"></div></div>
    <div class="feature-card"><div class="feature-icon">💬</div><div class="feature-title" data-i18n="feat6_title"></div><div class="feature-desc" data-i18n="feat6_desc"></div></div>
  </div>
</section>

<hr class="divider">

<section>
  <div class="section-label" data-i18n="how_label"></div>
  <h2 class="section-title" data-i18n="how_title"></h2>
  <div class="steps">
    <div class="step"><div class="step-num">1</div><div class="step-content"><h3 data-i18n="step1_title"></h3><p data-i18n="step1_desc"></p></div></div>
    <div class="step"><div class="step-num">2</div><div class="step-content"><h3 data-i18n="step2_title"></h3><p data-i18n="step2_desc"></p></div></div>
    <div class="step"><div class="step-num">3</div><div class="step-content"><h3 data-i18n="step3_title"></h3><p data-i18n="step3_desc"></p></div></div>
    <div class="step"><div class="step-num">4</div><div class="step-content"><h3 data-i18n="step4_title"></h3><p data-i18n="step4_desc"></p></div></div>
  </div>
</section>

<footer>

</footer>

let currentLang = 'en';

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === lang.toUpperCase()));
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (T[lang][key] !== undefined) el.textContent = T[lang][key];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.getAttribute('data-i18n-html');
    if (T[lang][key] !== undefined) el.innerHTML = T[lang][key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (T[lang][key] !== undefined) el.placeholder = T[lang][key];
  });
}

setLang('en');

</html>
